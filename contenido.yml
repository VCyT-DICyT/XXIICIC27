# =====================================================================
#  CONTENIDO DEL SITIO DEL XXII CIC 2027
# =====================================================================
#  Cómo editar este archivo:
#   1. Escriba el texto entre las comillas, después de los dos puntos.
#        Bien:   envio_resumenes: "15 de marzo de 2027"
#   2. Lo que se deje vacío ("") aparece en la página como «Por completar».
#   3. Las líneas que empiezan con # son notas: la página no las muestra.
#   4. Respete los espacios del inicio de cada línea. Use espacios, no la tecla Tab.
#   5. Para las listas, copie un bloque de ejemplo completo (desde el guion)
#      y cambie los datos. Mantenga el guion y la sangría.
#   6. Guarde con «Commit changes». La página se actualiza en 1 o 2 minutos.
# =====================================================================


